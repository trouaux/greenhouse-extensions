# Default values for exposed-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: mendhak/http-https-echo
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "40@sha256:d072446da821a767d05dc19fa5ab6a27b1150bfb5c6ecfaecf3a2e5f9812794c"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}


service:
  annotations: {}
  type: ClusterIP
  port: 8080

owner-info:
  support-group: containers
  maintainers:
    - Fabian Ruff
    - Arno Uhlig
  helm-chart-url: https://github.com/cloudoperators/greenhouse-extensions/tree/main/exposed-services
